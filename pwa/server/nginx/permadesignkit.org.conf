# nginx site config for permadesignkit.org — the versioned copy of
# /etc/nginx/sites-available/permadesignkit.org on the VPS. Edit here, then
# copy over, `nginx -t` and `systemctl reload nginx`.
#
# Maintenance mode: `touch /var/www/maintenance.on` answers every request
# with 503 + /var/www/maintenance/index.html (versioned as maintenance.html
# next to this file); `rm` it to go live again — no reload needed. The flag
# lives outside the webroot, so `npm run deploy` neither clobbers nor needs it.

# Hashed build output (/_astro/*) never changes under the same name, so it can
# be cached for a year. Everything else (HTML, sw.js, the Baumscheibe template,
# fonts) must be revalidated on every use — cheap thanks to ETag/304.
map $uri $pdk_cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# Terrain tiles (elevation for the garden plan): fetched from the AWS open-data
# bucket by *this* server and cached on disk, so visitors' browsers never
# contact Amazon (privacy) and a tile is downloaded once for everyone.
# One-time on the VPS: mkdir -p /var/cache/nginx (nginx creates the subdirectory).
proxy_cache_path /var/cache/nginx/pdk-terrain levels=1:2 keys_zone=pdk_terrain:20m max_size=2g inactive=180d use_temp_path=off;
# Site climate (30 years of daily weather, Open-Meteo archive): same idea —
# the browser sends a location rounded to 0.1°, this server asks Open-Meteo.
proxy_cache_path /var/cache/nginx/pdk-climate levels=1:2 keys_zone=pdk_climate:10m max_size=1g inactive=365d use_temp_path=off;
# Buildings around a garden (OpenStreetMap via Overpass): the browser sends
# only a bbox, this server builds the fixed buildings query, asks Overpass
# (with a proper User-Agent, as its usage policy asks) and keeps the answer —
# the public Overpass instances are often overloaded, a cached copy is served
# even while they are down, and visitors' addresses never reach them.
proxy_cache_path /var/cache/nginx/pdk-overpass levels=1:2 keys_zone=pdk_overpass:10m max_size=2g inactive=365d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=pdk_overpass_rl:1m rate=10r/m;
# overpass-api.de is two servers (gall, lambert): when one is too busy (504)
# nginx asks the other. `resolve` follows address changes without a reload.
upstream pdk_overpass_up {
    zone pdk_overpass_up 64k;
    resolver 127.0.0.53 valid=300s;
    server overpass-api.de:443 resolve;
}

server {
    server_name permadesignkit.org;

    access_log off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self): the garden plan's field mode shows the own position (stays in the browser).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cache-Control $pdk_cache_control always;

    # No inline scripts anywhere (pre-paint code is /boot.js), so script-src
    # needs no 'unsafe-inline' — markup injected through a data field can't
    # run. connect-src stays open to https: because WebDAV sync talks to
    # whatever server the user configures; img-src because plant images can
    # come from any https URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.permadesignkit.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    root /var/www/permadesignkit.org;
    index index.html;

    error_page 503 @maintenance;
    location @maintenance {
        # No add_header here — it would drop the server-level CSP/HSTS.
        root /var/www/maintenance;
        rewrite ^ /index.html break;
    }

    location /api/plant-proxy {
        if (-f /var/www/maintenance.on) { return 503; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /geo/terrain/{z}/{x}/{y}.png -> terrarium tile. No add_header here (it would
    # drop the server-level CSP/HSTS); the x-amz-meta-x-imagery-sources header
    # (which data sources a tile is built from) passes through for the credits.
    location /geo/terrain/ {
        if (-f /var/www/maintenance.on) { return 503; }
        limit_except GET { deny all; }
        proxy_pass https://s3.amazonaws.com/elevation-tiles-prod/terrarium/;
        proxy_ssl_server_name on;
        proxy_set_header Host s3.amazonaws.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_cache pdk_terrain;
        proxy_cache_valid 200 90d;
        proxy_cache_valid 403 404 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # /geo/climate?latitude=…&longitude=…&… -> Open-Meteo historical archive.
    location = /geo/climate {
        if (-f /var/www/maintenance.on) { return 503; }
        limit_except GET { deny all; }
        proxy_pass https://archive-api.open-meteo.com/v1/archive;
        proxy_ssl_server_name on;
        proxy_set_header Host archive-api.open-meteo.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_cache pdk_climate;
        proxy_cache_valid 200 365d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /geo/overpass?bbox=s,w,n,e[&refresh=1] -> all buildings in that box
    # (src/lib/osm-buildings.ts). No open proxy: only a 4-decimal bbox is
    # accepted, the query is fixed. refresh=1 replaces a cached answer that
    # turned out to be an Overpass error ("remark", sent with HTTP 200).
    location = /geo/overpass {
        if (-f /var/www/maintenance.on) { return 503; }
        limit_except GET { deny all; }
        if ($arg_bbox !~ "^-?[0-9]{1,2}\.[0-9]{4},-?[0-9]{1,3}\.[0-9]{4},-?[0-9]{1,2}\.[0-9]{4},-?[0-9]{1,3}\.[0-9]{4}$") { return 400; }
        set $pdk_bbox $arg_bbox;
        set $pdk_refresh $arg_refresh;
        set $args "";
        limit_req zone=pdk_overpass_rl burst=20 nodelay;
        proxy_pass https://pdk_overpass_up/api/interpreter;
        proxy_ssl_server_name on;
        proxy_ssl_name overpass-api.de;
        # POST is not idempotent for nginx — here it is (a read-only query).
        proxy_next_upstream error timeout http_429 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 90s;
        proxy_method POST;
        proxy_set_header Host overpass-api.de;
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_set_header User-Agent "PermaDesignKit/1.0 (+https://permadesignkit.org; buildings cache)";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        # [out:json][timeout:25];(way["building"](BBOX);relation["building"]["type"="multipolygon"](BBOX););out geom tags;
        proxy_set_body "data=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3B%28way%5B%22building%22%5D%28$pdk_bbox%29%3Brelation%5B%22building%22%5D%5B%22type%22%3D%22multipolygon%22%5D%28$pdk_bbox%29%3B%29%3Bout%20geom%20tags%3B";
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache pdk_overpass;
        proxy_cache_key "overpass|$pdk_bbox";
        proxy_cache_bypass $pdk_refresh;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        if (-f /var/www/maintenance.on) { return 503; }
        try_files $uri $uri/ $uri/index.html =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/permadesignkit.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/permadesignkit.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = permadesignkit.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name permadesignkit.org;
    return 404; # managed by Certbot


}
